<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue circle background -->
  <circle cx="50" cy="50" r="50" fill="#1A1AEB"/>

  <!-- Simplified white city skyline (filled, bold) -->
  <!-- Tallest building left (angled top) -->
  <polygon points="18,68 26,22 36,22 36,68" fill="white"/>
  <!-- Medium building -->
  <rect x="38" y="35" width="12" height="33" rx="1" fill="white"/>
  <!-- Tallest center building -->
  <rect x="52" y="26" width="14" height="42" rx="1" fill="white"/>
  <!-- Right building -->
  <rect x="68" y="38" width="12" height="30" rx="1" fill="white"/>

  <!-- Two white pill lines -->
  <rect x="22" y="72" width="56" height="5" rx="2.5" fill="white"/>
  <rect x="30" y="80" width="40" height="4" rx="2" fill="white"/>
</svg>
